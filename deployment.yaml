apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist-api
  template:
    metadata:
      labels:
        app: todolist-api
    spec:
      containers:
        - name: todolist-api
          image: todolist-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: todolist-secrets