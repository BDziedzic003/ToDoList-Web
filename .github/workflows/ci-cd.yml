name: CI/CD

on:
  push:
    branches: [ master-postgresql ]
  pull_request:
    branches: [ master-postgresql ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK Install
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dependencies restore
        run: dotnet restore ToDoList.Api.slnx

      - name: Build
        run: dotnet build ToDoList.Api.slnx --no-restore --configuration Release

      - name: Tests
        run: dotnet test ToDoList.Api.slnx --no-build --configuration Release --verbosity normal
        env:
          Jwt__Key: "testkeytestkeytestkeytestkeytestkeytestkeytestkey"
          Jwt__Issuer: "ToDoListApi"
          Jwt_Audience: "ToDoListApiUsers"

  build-docker-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/master-postgresql' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t todolist-api:${{ github.sha }} -f ToDoList.Api/Dockerfile .